[package]
name = "clone-genealogy-weaver"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "cgweave"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.35"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["fs", "process", "thread"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.4.6"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
toml = "1.2.1"
uuid = { version = "1.29.2", features = ["v4"] }
